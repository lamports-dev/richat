[package]
name = "richat-plugin-agave-fuzz"
version = "0.0.0"
authors = ["Lamports Dev"]
edition = "2024"
description = "Richat Agave Geyser Plugin Fuzz Tests"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[[bin]]
name = "account"
path = "fuzz_targets/account.rs"
test = true
doc = false
bench = false

[[bin]]
name = "blockmeta"
path = "fuzz_targets/blockmeta.rs"
test = true
doc = false
bench = false

[[bin]]
name = "entry"
path = "fuzz_targets/entry.rs"
test = true
doc = false
bench = false

[[bin]]
name = "slot"
path = "fuzz_targets/slot.rs"
test = true
doc = false
bench = false

[[bin]]
name = "transaction"
path = "fuzz_targets/transaction.rs"
test = true
doc = false
bench = false

[dependencies]
agave-geyser-plugin-interface = "~4.0.0-rc.0"
arbitrary = { version = "1.4.1", features = ["derive"] }
const-hex = "1.14.0"
libfuzzer-sys = "0.4.8"
richat-plugin-agave = { path = ".." }
solana-account-decoder = { version = "~4.0.0-rc.0", features = ["agave-unstable-api"] }
solana-hash = "4.3.0"
solana-instruction-error = "2.3.0"
solana-message = "3.1.0"
solana-pubkey = { version = "4.2.0", features = ["rand"] }
solana-signature = { version = "3.4.0", features = ["rand"] }
solana-transaction = "3.1.0"
solana-transaction-context = { version = "~4.0.0-rc.0", features = ["agave-unstable-api"] }
solana-transaction-error = "3.2.0"
solana-transaction-status = { version = "~4.0.0-rc.0", features = ["agave-unstable-api"] }
